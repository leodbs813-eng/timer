<!DOCTYPE html>  
<html lang="ko">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Deep Sea & Firefly Minimalist Timer</title>  
    <!-- Tailwind CSS CDN -->  
    <script src="https://cdn.tailwindcss.com"></script>  
    <style>  
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght=0,100;0,200;0,300;0,400;1,100&family=Noto+Sans+KR:wght=300;400;500&display=swap');  
          
        body {  
            font-family: 'Noto Sans KR', sans-serif;  
            background-color: #030307;  
            transition: background-color 2.5s cubic-bezier(0.25, 1, 0.5, 1);  
        }  
          
        .timer-font {  
            font-family: 'Montserrat', sans-serif;  
            font-weight: 100;  
        }  
  
        /* 공간 음영용 실시간 글로우 백라이트 */  
        .aquarium-backlight {  
            filter: blur(150px);  
            opacity: 0.12;  
            transition: background 2.5s ease-in-out;  
            pointer-events: none;  
        }  
  
        /* 라이팅/모드 칩 인터랙티브 */  
        .color-dot, .mode-tab {  
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);  
        }  
        .color-dot:hover {  
            transform: scale(1.15);  
        }  

        /* 모바일 및 터치 슬라이더 원활하도록 웹킷 기본 기능 및 포인터 활성화 */  
        input[type="range"] {  
            -webkit-appearance: none;  
            appearance: none;  
            width: 100%;  
            background: rgba(255, 255, 255, 0.08);  
            border-radius: 9999px;  
            height: 8px;  
            outline: none;  
            cursor: pointer;  
            touch-action: none; /* 슬라이더 동작 중 화면 스크롤 방지 */  
        }  
        input[type="range"]::-webkit-slider-thumb {  
            -webkit-appearance: none;  
            appearance: none;  
            width: 20px;  
            height: 20px;  
            border-radius: 50%;  
            background: #06b6d4;  
            cursor: grab;  
            transition: transform 0.1s, background-color 0.2s;  
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);  
        }  
        input[type="range"]::-webkit-slider-thumb:active {  
            cursor: grabbing;  
            transform: scale(1.2);  
            background-color: #22d3ee;  
        }  
        input[type="range"]::-moz-range-thumb {  
            width: 20px;  
            height: 20px;  
            border: none;  
            border-radius: 50%;  
            background: #06b6d4;  
            cursor: grab;  
            transition: transform 0.1s, background-color 0.2s;  
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);  
        }  
        input[type="range"]::-moz-range-thumb:active {  
            cursor: grabbing;  
            transform: scale(1.2);  
            background-color: #22d3ee;  
        }  
    </style>  
</head>  
<body class="text-slate-400 min-h-screen select-none overflow-hidden relative flex items-center justify-center p-4">  
  
    <!-- 공간 백라이트 싱크 -->  
    <div id="backlight" class="absolute w-[500px] h-[500px] rounded-full aquarium-backlight z-0 top-[35%] left-[50%] -translate-x-1/2 -translate-y-1/2 bg-cyan-500"></div>  
  
    <!-- 화면 전체를 가득 채우는 몽환적인 유동 자연 캔버스 -->  
    <canvas id="aquariumCanvas" class="absolute inset-0 w-full h-full z-0 block"></canvas>  
  
    <!-- 중앙: 초간결 미니멀 공부 대시보드 (반투명 글래스모피즘 스타일) -->  
    <div id="timer-panel" class="w-full max-w-[320px] flex flex-col items-center text-center z-10 bg-[#07070d]/25 backdrop-blur-[6px] border border-white/[0.06] p-8 rounded-[36px] shadow-[0_30px_100px_rgba(0,0,0,0.5)] transition-transform duration-300">  
          
        <!-- 환경 전환 탭 -->  
        <div class="flex bg-white/[0.02] border border-white/[0.04] p-1 rounded-xl mb-6 w-full">  
            <button onclick="switchEnvironment('jellyfish')" id="tab-jellyfish" class="mode-tab flex-1 py-2 rounded-lg text-xs font-medium tracking-wide bg-white/[0.05] text-cyan-400">  
                심해 해파리  
            </button>  
            <button onclick="switchEnvironment('firefly')" id="tab-firefly" class="mode-tab flex-1 py-2 rounded-lg text-xs font-medium tracking-wide text-slate-500 hover:text-slate-300">  
                반딧불이 숲  
            </button>  
        </div>  
  
        <!-- 현재 집중 모드 인디케이터 배지 -->  
        <div class="flex items-center mb-1">  
            <div id="mode-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-medium tracking-wider bg-cyan-500/10 text-cyan-400 border border-cyan-500/15 transition-all duration-500 uppercase">  
                STUDYING  
            </div>  
        </div>  
  
        <!-- 초대형 얇은 미니멀 타이머 디스플레이 -->  
        <div id="timer-display" onclick="openTimerSettings()" class="timer-font text-7xl md:text-8xl tracking-tighter text-slate-100 leading-none cursor-pointer hover:text-cyan-400 transition-colors duration-300 relative group" title="클릭하여 시간 변경">  
            30:00  
            <span class="absolute -bottom-4 left-1/2 transform -translate-x-1/2 text-[9px] text-slate-500 font-light opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">시간 변경</span>  
        </div>  
  
        <!-- 수조 조명 컨트롤러 -->  
        <div id="lighting-section" class="w-full mt-7 flex flex-col items-center gap-2.5 transition-opacity duration-500">  
            <span class="text-[10px] text-slate-500 tracking-wider">LIGHTING</span>  
            <div class="flex items-center gap-3">  
                <button id="color-btn-cyan" onclick="setThemeColor('cyan')" class="color-dot w-8 h-8 rounded-full bg-cyan-500 border-2 border-white/60 active:scale-95 shadow-[0_0_12px_rgba(6,182,212,0.6)]" title="아쿠아 시안"></button>  
                <button id="color-btn-magenta" onclick="setThemeColor('magenta')" class="color-dot w-8 h-8 rounded-full bg-pink-500 border-2 border-transparent active:scale-95" title="마젠타 핑크"></button>  
                <button id="color-btn-emerald" onclick="setThemeColor('emerald')" class="color-dot w-8 h-8 rounded-full bg-emerald-500 border-2 border-transparent active:scale-95" title="에메랄드 그린"></button>  
                <button id="color-btn-purple" onclick="setThemeColor('purple')" class="color-dot w-8 h-8 rounded-full bg-purple-600 border-2 border-transparent active:scale-95" title="미스틱 퍼플"></button>  
                <button id="color-btn-gold" onclick="setThemeColor('gold')" class="color-dot w-8 h-8 rounded-full bg-amber-400 border-2 border-transparent active:scale-95" title="오라 골드"></button>  
            </div>  
        </div>  
  
        <!-- 생명체 소환 카운터 (UI 일관성 완벽 통일) -->  
        <div class="mt-6 w-full flex flex-col gap-2.5 border-t border-white/5 pt-5 text-xs text-slate-500 font-light">  
            <!-- 일반 개체 -->  
            <div class="flex items-center justify-between w-full">  
                <span id="creature-label" class="text-slate-400 font-light">일반 해파리</span>  
                <span id="creature-count" class="font-normal text-cyan-400 bg-cyan-500/5 px-2.5 py-1 rounded text-[11px] font-semibold border border-cyan-500/10 transition-all duration-500">0마리</span>  
            </div>  
            <!-- 특별 개체 현황 표시 레이어 (일반 개체와 디자인 100% 통합) -->  
            <div class="flex items-center justify-between w-full" id="special-creature-row">  
                <span id="special-label" class="text-amber-400 font-light">✨ 에인션트 코랄</span>  
                <span id="special-count" class="font-normal text-amber-400 bg-amber-500/5 px-2.5 py-1 rounded text-[11px] font-semibold border border-amber-500/10 transition-all duration-500">0마리</span>  
            </div>  
        </div>  
  
        <!-- 미니멀 얇은 컨트롤 버튼 배열 -->  
        <div class="flex flex-col gap-2 w-full mt-8">  
            <div class="flex items-center gap-2 w-full">  
                <button id="btn-toggle" onclick="toggleTimer()" class="flex-[2] py-3.5 px-5 rounded-xl font-medium text-xs bg-cyan-500 hover:bg-cyan-400 text-slate-950 transition-all shadow-md shadow-cyan-500/5 active:scale-[0.98]">  
                    시작  
                </button>  
                <button onclick="resetTimer()" class="flex-1 py-3.5 px-5 rounded-xl font-medium text-xs bg-[#0b0c13]/80 hover:bg-[#12141f] text-slate-300 border border-white/5 transition-all active:scale-[0.98]">  
                    리셋  
                </button>  
            </div>  
            <!-- 무소음 즉시 방류 (테스트용) -->  
            <button onclick="instantCycle()" class="py-2.5 px-4 rounded-lg font-light text-[10px] bg-[#030306]/30 hover:bg-white/[0.02] border border-white/[0.02] text-slate-600 hover:text-slate-400 transition-all" id="btn-cheat">  
                테스트 소환  
            </button>  
        </div>  
    </div>  
  
    <!-- 타이머 설정 커스텀 모달 -->  
    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 p-4">  
        <div class="w-full max-w-[300px] bg-[#090911]/95 border border-white/10 rounded-[28px] p-6 shadow-2xl transform scale-95 transition-transform duration-300" id="settings-modal-content">  
            
            <div class="flex flex-col gap-6">  
                <!-- 집중 시간 설정 -->  
                <div class="flex flex-col gap-2">  
                    <div class="flex justify-between items-center text-xs">  
                        <span class="text-slate-400">STUDY</span>  
                        <span class="text-cyan-400 font-semibold" id="val-study">30분</span>  
                    </div>  
                    <input type="range" id="input-study" min="1" max="180" value="30" oninput="updateModalVal('study', this.value)" class="w-full">  
                </div>  
  
                <!-- 복습 시간 설정 -->  
                <div class="flex flex-col gap-2">  
                    <div class="flex justify-between items-center text-xs">  
                        <span class="text-slate-400">REVIEW</span>  
                        <span class="text-cyan-400 font-semibold" id="val-review">5분</span>  
                    </div>  
                    <input type="range" id="input-review" min="1" max="60" value="5" oninput="updateModalVal('review', this.value)" class="w-full">  
                </div>  
  
                <!-- 휴식 시간 설정 -->  
                <div class="flex flex-col gap-2">  
                    <div class="flex justify-between items-center text-xs">  
                        <span class="text-slate-400">BREAK</span>  
                        <span class="text-cyan-400 font-semibold" id="val-break">5분</span>  
                    </div>  
                    <input type="range" id="input-break" min="1" max="60" value="5" oninput="updateModalVal('break', this.value)" class="w-full">  
                </div>  
            </div>  
  
            <div class="flex gap-2.5 mt-7">  
                <button onclick="closeTimerSettings()" class="flex-1 py-3 rounded-xl bg-white/[0.02] border border-white/5 hover:bg-white/[0.05] text-slate-400 text-xs font-light transition-all">  
                    취소  
                </button>  
                <button onclick="saveTimerSettings()" class="flex-1 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-medium transition-all shadow-md shadow-cyan-500/10">  
                    반영  
                </button>  
            </div>  
        </div>  
    </div>  
  
    <!-- 구석에 흐릿하게 표시될 시그니처 워터마크 -->  
    <div id="view-label" class="absolute bottom-8 left-8 z-10 text-[8px] text-white/10 font-light tracking-[0.3em] uppercase pointer-events-none">  
        Bioluminescent Sanctuary  
    </div>  
  
    <!-- 미니멀 알림용 토스트 -->  
    <div id="alarm-toast" class="fixed bottom-6 right-6 z-50 transform translate-y-12 opacity-0 pointer-events-none transition-all duration-500 bg-slate-950/95 backdrop-blur-md border border-white/5 px-5 py-3.5 rounded-xl shadow-2xl flex items-center gap-3 text-xs">  
        <span id="toast-icon">🔔</span>  
        <div class="flex flex-col">  
            <span class="font-semibold text-slate-200" id="toast-title">STATUS</span>  
            <span class="text-[10px] text-slate-400 mt-0.5" id="toast-message">시간이 완료되었습니다.</span>  
        </div>  
    </div>  
  
    <!-- 알림 소리 -->  
    <audio id="bell-sound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-120.wav" preload="auto"></audio>  
  
    <script>  
        const TIMES = {  
            STUDY: 30 * 60,  
            REVIEW: 5 * 60,  
            BREAK: 5 * 60  
        };  
  
        let currentMode = 'STUDY';   
        let timeLeft = TIMES.STUDY;  
        let timerInterval = null;  
        let isRunning = false;  
        let completedCycles = 0;  
          
        let currentEnvironment = 'jellyfish';  
  
        const colorPresets = {  
            cyan: {  
                hue: 195,  
                btnColor: '#06b6d4',  
                badgeText: 'text-cyan-400',  
                badgeBg: 'bg-cyan-500/10',  
                badgeBorder: 'border-cyan-500/15'  
            },  
            magenta: {  
                hue: 325,  
                btnColor: '#ec4899',  
                badgeText: 'text-pink-400',  
                badgeBg: 'bg-pink-500/10',  
                badgeBorder: 'border-pink-500/15'  
            },  
            emerald: {  
                hue: 150,  
                btnColor: '#10b981',  
                badgeText: 'text-emerald-400',  
                badgeBg: 'bg-emerald-500/10',  
                badgeBorder: 'border-emerald-500/15'  
            },  
            purple: {  
                hue: 275,  
                btnColor: '#9333ea',  
                badgeText: 'text-purple-400',  
                badgeBg: 'bg-purple-500/10',  
                badgeBorder: 'border-purple-500/15'  
            },  
            gold: {  
                hue: 38,  
                btnColor: '#f59e0b',  
                badgeText: 'text-amber-400',  
                badgeBg: 'bg-amber-500/10',  
                badgeBorder: 'border-amber-500/15'  
            }  
        };  
  
        let activeColorKey = 'cyan';  
  
        const timerDisplay = document.getElementById('timer-display');  
        const modeBadge = document.getElementById('mode-badge');  
        const creatureCountDisplay = document.getElementById('creature-count');  
        const btnToggle = document.getElementById('btn-toggle');  
        const bellSound = document.getElementById('bell-sound');  
        const viewLabel = document.getElementById('view-label');  
  
        const creatureLabel = document.getElementById('creature-label');  
        const btnCheat = document.getElementById('btn-cheat');  
        const lightingSection = document.getElementById('lighting-section');  
  
        const specialLabel = document.getElementById('special-label');  
        const specialCountDisplay = document.getElementById('special-count');  
  
        const alarmToast = document.getElementById('alarm-toast');  
        const toastTitle = document.getElementById('toast-title');  
        const toastMessage = document.getElementById('toast-message');  
        const toastIcon = document.getElementById('toast-icon');  
        let toastTimeout = null;  
  
        // 모달 관련 셀렉터  
        const settingsModal = document.getElementById('settings-modal');  
        const settingsModalContent = document.getElementById('settings-modal-content');  
        const inputStudy = document.getElementById('input-study');  
        const inputReview = document.getElementById('input-review');  
        const inputBreak = document.getElementById('input-break');  
  
        function showToast(title, msg, icon) {  
            toastTitle.textContent = title;  
            toastMessage.textContent = msg;  
            toastIcon.textContent = icon;  
            alarmToast.classList.remove('translate-y-12', 'opacity-0', 'pointer-events-none');  
              
            if (toastTimeout) clearTimeout(toastTimeout);  
            toastTimeout = setTimeout(closeToast, 6000);  
        }  
  
        window.closeToast = function() {  
            alarmToast.classList.add('translate-y-12', 'opacity-0', 'pointer-events-none');  
        }  
  
        window.setThemeColor = function(colorName) {  
            activeColorKey = colorName;  
            const preset = colorPresets[colorName];  
              
            const backlight = document.getElementById('backlight');  
            if (backlight) backlight.style.background = preset.btnColor;  
              
            const buttons = document.querySelectorAll('.color-dot');  
            buttons.forEach(btn => {  
                btn.style.borderColor = 'transparent';  
                btn.style.boxShadow = 'none';  
            });  
              
            const activeBtn = document.getElementById(`color-btn-${colorName}`);  
            if (activeBtn) {  
                activeBtn.style.borderColor = 'rgba(255, 255, 255, 0.6)';  
                activeBtn.style.boxShadow = `0 0 14px ${preset.btnColor}`;  
            }  
              
            updateStyleWithPreset();  
            renderDisplay();  
        }  
  
        function updateStyleWithPreset() {  
            const preset = colorPresets[activeColorKey];  
            modeBadge.className = `px-2.5 py-0.5 rounded-full text-[10px] font-medium tracking-wider ${preset.badgeBg} ${preset.badgeText} ${preset.badgeBorder} transition-all duration-500 uppercase`;  
            
            // 일반 개체 카운터 스타일링 동적 매핑  
            creatureCountDisplay.className = `font-normal ${preset.badgeText} ${preset.badgeBg} px-2.5 py-1 rounded text-[11px] font-semibold border ${preset.badgeBorder} transition-all duration-500`;  
              
            if (isRunning) {  
                btnToggle.style.backgroundColor = '#0b0c13';  
                btnToggle.style.color = '#cbd5e1';  
                btnToggle.style.borderColor = '#1e293b';  
                btnToggle.style.boxShadow = 'none';  
                btnToggle.textContent = '일시 정지';  
            } else {  
                btnToggle.style.backgroundColor = preset.btnColor;  
                btnToggle.style.color = '#010103';  
                btnToggle.style.borderColor = 'transparent';  
                btnToggle.style.boxShadow = `0 8px 20px -3px ${preset.btnColor}15`;  
                btnToggle.textContent = '시작';  
            }  
        }  
  
        window.switchEnvironment = function(envName) {  
            if (currentEnvironment === envName) return;  
            currentEnvironment = envName;  
  
            const tabJellyfish = document.getElementById('tab-jellyfish');  
            const tabFirefly = document.getElementById('tab-firefly');  
  
            if (currentEnvironment === 'jellyfish') {  
                tabJellyfish.className = "mode-tab flex-1 py-1.5 rounded-lg text-xs font-medium tracking-wide bg-white/[0.04] text-cyan-400";  
                tabFirefly.className = "mode-tab flex-1 py-1.5 rounded-lg text-xs font-medium tracking-wide text-slate-500 hover:text-slate-300";  
                  
                creatureLabel.textContent = "일반 해파리";  
                btnCheat.textContent = "테스트 소환";  
                viewLabel.textContent = `Bioluminescent Sanctuary`;  
                lightingSection.style.opacity = "1";  
                lightingSection.style.pointerEvents = "auto";  
                  
                document.body.style.backgroundColor = "#010103";  
                setThemeColor('cyan');  
  
            } else {  
                tabFirefly.className = "mode-tab flex-1 py-1.5 rounded-lg text-xs font-medium tracking-wide bg-white/[0.04] text-amber-400";  
                tabJellyfish.className = "mode-tab flex-1 py-1.5 rounded-lg text-xs font-medium tracking-wide text-slate-500 hover:text-slate-300";  
                  
                creatureLabel.textContent = "일반 반딧불이";  
                btnCheat.textContent = "테스트 소환";  
                viewLabel.textContent = `Mystic Firefly Forest`;  
                  
                document.body.style.backgroundColor = "#020302";  
                setThemeColor('gold');  
                lightingSection.style.opacity = "0.15";  
                lightingSection.style.pointerEvents = "none";  
            }  
  
            resizeCanvas(true); // 강제 초기화 및 재생성  
            renderDisplay();  
        }  
  
        function renderDisplay() {  
            const m = Math.floor(timeLeft / 60);  
            const s = timeLeft % 60;  
            timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;  
  
            if (currentMode === 'STUDY') {  
                modeBadge.textContent = 'STUDY';  
            } else if (currentMode === 'REVIEW') {  
                modeBadge.textContent = 'REVIEW';  
            } else if (currentMode === 'BREAK') {  
                modeBadge.textContent = 'BREAK';  
            }  
  
            if (currentEnvironment === 'jellyfish') {  
                const normals = jellyfishes.filter(j => !j.isSpecial).length;  
                const specials = jellyfishes.filter(j => j.isSpecial).length;  
                creatureCountDisplay.textContent = `${normals}마리`;  
                specialLabel.textContent = "에인션트 코랄";  
                specialCountDisplay.textContent = `${specials}마리`;  
            } else {  
                const normals = fireflies.filter(f => !f.isSpecial).length;  
                const specials = fireflies.filter(f => f.isSpecial).length;  
                creatureCountDisplay.textContent = `${normals}마리`;  
                specialLabel.textContent = "오로라 프리즘";  
                specialCountDisplay.textContent = `${specials}마리`;  
            }  
        }  
  
        window.toggleTimer = function() {  
            if (isRunning) {  
                clearInterval(timerInterval);  
                timerInterval = null;  
                isRunning = false;  
                updateStyleWithPreset();  
            } else {  
                isRunning = true;  
                updateStyleWithPreset();  
  
                timerInterval = setInterval(() => {  
                    timeLeft--;  
                    if (timeLeft < 0) {  
                        clearInterval(timerInterval);  
                        timerInterval = null;  
                        isRunning = false;  
                        handleSequenceComplete();  
                    }  
                    renderDisplay();  
                }, 1000);  
            }  
        }  
  
        function resetTimer() {  
            clearInterval(timerInterval);  
            timerInterval = null;  
            isRunning = false;  
            currentMode = 'STUDY';  
            timeLeft = TIMES.STUDY;  
            btnToggle.textContent = '집중 루틴 시작';  
            updateStyleWithPreset();  
            renderDisplay();  
        }  
  
        function handleSequenceComplete() {  
            try {  
                bellSound.currentTime = 0;  
                bellSound.play();  
            } catch(e) {}  
  
            if (currentMode === 'STUDY') {

        // ==========================================  
        //  CANVAS 해파리 & 반딧불이 물리 렌더러  
        // ==========================================  
        const canvas = document.getElementById('aquariumCanvas');  
        const ctx = canvas.getContext('2d');  
  
        let jellyfishes = [];  
        let fireflies = [];  
        let backgroundBubbles = [];  
        let screenParticles = []; // 특별 이펙트 및 비행 궤적 입자들  
  
        // 휘젓기 상호작용 관련 데이터  
        let mouseX = -1000;  
        let mouseY = -1000;  
        let prevMouseX = -1000;  
        let prevMouseY = -1000;  
        let isSwaying = false;  
        let swayPower = 0; // 마우스 이동 속도에 따른 파동 세기  
  
        // 리사이즈 루프 최적화용 캐시 변수  
        let lastWidth = 0;  
        let lastHeight = 0;  
        let canvasRect = { left: 0, top: 0 };  
  
        function resizeCanvas(force = false) {  
            const w = window.innerWidth;  
            const h = window.innerHeight;  
              
            if (!force && w === lastWidth && h === lastHeight) return;  
              
            lastWidth = w;  
            lastHeight = h;  
              
            canvas.width = w * window.devicePixelRatio;  
            canvas.height = h * window.devicePixelRatio;  
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);  
  
            canvasRect = canvas.getBoundingClientRect();  
        }  
        window.addEventListener('resize', () => resizeCanvas(false));  
        resizeCanvas(true);  
  
        // 터치 및 마우스 리스너 등록 (골고루 섞기용)  
        function trackInteraction(clientX, clientY) {  
            prevMouseX = mouseX;  
            prevMouseY = mouseY;  
            mouseX = clientX - canvasRect.left;  
            mouseY = clientY - canvasRect.top;  
  
            if (prevMouseX !== -1000) {  
                const dx = mouseX - prevMouseX;  
                const dy = mouseY - prevMouseY;  
                swayPower = Math.min(Math.sqrt(dx * dx + dy * dy) * 0.45, 12);  
            }  
            isSwaying = true;  
        }  
  
        canvas.addEventListener('mousemove', (e) => {  
            trackInteraction(e.clientX, e.clientY);  
        });  
  
        canvas.addEventListener('mousedown', (e) => {  
            trackInteraction(e.clientX, e.clientY);  
            swayPower = 12;  
        });  
  
        canvas.addEventListener('mouseleave', () => {  
            mouseX = -1000;  
            mouseY = -1000;  
            isSwaying = false;  
        });  
  
        canvas.addEventListener('touchstart', (e) => {  
            if (e.touches.length > 0) {  
                trackInteraction(e.touches[0].clientX, e.touches[0].clientY);  
                swayPower = 12;  
            }  
        });  
  
        canvas.addEventListener('touchmove', (e) => {  
            if (e.touches.length > 0) {  
                trackInteraction(e.touches[0].clientX, e.touches[0].clientY);  
            }  
        });  
  
        canvas.addEventListener('touchend', () => {  
            mouseX = -1000;  
            mouseY = -1000;  
            isSwaying = false;  
        });  
  
        // 찬란한 대폭발 파티클 이펙트 생성 함수  
        function triggerAscensionVisual(centerX, centerY, colorHue) {  
            for (let i = 0; i < 60; i++) {  
                const angle = Math.random() * Math.PI * 2;  
                const speed = 1.0 + Math.random() * 4.5;  
                screenParticles.push({  
                    x: centerX,  
                    y: centerY,  
                    vx: Math.cos(angle) * speed,  
                    vy: Math.sin(angle) * speed,  
                    radius: 1.5 + Math.random() * 2.5,  
                    hue: colorHue + (Math.random() - 0.5) * 40,  
                    alpha: 1.0,  
                    decay: 0.012 + Math.random() * 0.015,  
                    type: 'ascension'  
                });  
            }  
        }  
  
        class Bubble {  
            constructor() {  
                const w = window.innerWidth;  
                const h = window.innerHeight;  
                this.x = Math.random() * w;  
                this.y = h + Math.random() * 20;  
                this.radius = Math.random() * 1.0 + 0.3;  
                this.speedY = Math.random() * 0.12 + 0.04;   
            }  
            update() {  
                const w = window.innerWidth;  
                const h = window.innerHeight;  
                this.y -= this.speedY;  
                this.x += Math.sin(this.y * 0.01) * 0.05;  
                if (this.y < -10) {  
                    this.y = h + 10;  
                    this.x = Math.random() * w;  
                }  
            }  
            draw() {  
                ctx.beginPath();  
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);  
                if (currentEnvironment === 'jellyfish') {  
                    ctx.fillStyle = `hsla(${colorPresets[activeColorKey].hue}, 80%, 70%, 0.04)`;  
                } else {  
                    ctx.fillStyle = `rgba(140, 200, 100, 0.03)`;  
                }  
                ctx.fill();  
            }  
        }  
  
        // 사실적인 해파리 생체 구조 클래스 (에인션트 보색 코어 라이팅 병합)  
        class RealisticJellyfish {  
            constructor(isSpecial = false) {  
                const w = window.innerWidth;  
                const h = window.innerHeight;  
                  
                const spawnMarginX = w > 640 ? 120 : 60;  
                const spawnMarginY = h > 640 ? 120 : 60;  
  
                this.x = spawnMarginX + Math.random() * (w - spawnMarginX * 2);  
                this.y = spawnMarginY + Math.random() * (h - spawnMarginY * 2);  
                  
                this.vx = 0;  
                this.vy = -0.15;   
                  
                this.isSpecial = isSpecial; // 특별 고대종 해파리 여부  
                this.personality = Math.random() < 0.45 ? 'active' : 'calm';  
                  
                if (this.isSpecial) {  
                    // 고대종 해파리의 웅장한 신체 규격  
                    this.radius = this.personality === 'active'  
                        ? 21 + Math.random() * 3.5  
                        : 26 + Math.random() * 5.5;  
                    this.speedLimit = this.personality === 'active' ? 0.38 : 0.14;  
                    this.pulseDurationSpeed = this.personality === 'active' ? 0.018 : 0.006;   
                } else {  
                    this.radius = this.personality === 'active'   
                        ? 11 + Math.random() * 2.5   
                        : 14 + Math.random() * 4.5;   
                    this.speedLimit = this.personality === 'active' ? 0.42 : 0.14;  
                    this.pulseDurationSpeed = this.personality === 'active' ? 0.022 : 0.007;   
                }  
                  
                this.pulseTimer = Math.random() * Math.PI * 2;  
                  
                this.angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.18;   
                this.targetAngle = this.angle;  
                  
                this.domeRatioX = 1.0;  
                this.domeRatioY = 1.0;  
  
                this.hueOffset = (Math.random() - 0.5) * 45;   
                this.alpha = this.personality === 'active' ? 0.52 + Math.random() * 0.1 : 0.62 + Math.random() * 0.15;  
  
                // 실 촉수  
                this.tentacles = [];  
                const thinTentacleCount = this.isSpecial ? 8 : (this.personality === 'active' ? 4 : 6);  
                for (let i = 0; i < thinTentacleCount; i++) {  
                    let segments = [];  
                    const length = this.isSpecial ? 13 : (this.personality === 'active' ? 5 : 7);   
                    for (let s = 0; s < length; s++) {  
                        segments.push({ x: this.x, y: this.y });  
                    }  
                    this.tentacles.push({ segments });  
                }  
  
                // 구강완 프릴 촉수  
                this.oralArms = [];  
                const armCount = this.isSpecial ? 4 : 2;  
                for (let i = 0; i < armCount; i++) {  
                    let segments = [];  
                    const length = this.isSpecial ? 10 : (this.personality === 'active' ? 4 : 6);   
                    for (let s = 0; s < length; s++) {  
                        segments.push({ x: this.x, y: this.y });  
                    }  
                    this.oralArms.push(segments);  
                }  
            }  
  
            update(index) {  
                const w = window.innerWidth;  
                const h = window.innerHeight;  
                  
                this.pulseTimer += this.pulseDurationSpeed;  
                  
                const rawPulse = Math.sin(this.pulseTimer);  
                const isContracting = rawPulse > 0.65;   
  
                if (isContracting) {  
                    this.domeRatioX += (0.75 - this.domeRatioX) * 0.12;  
                    this.domeRatioY += (1.18 - this.domeRatioY) * 0.12;  
  
                    const pushFactor = this.personality === 'active' ? 0.075 : 0.02;  
                    const pushPower = pushFactor + (this.radius * 0.0008);  
                      
                    this.vx += Math.cos(this.angle) * pushPower;  
                    this.vy += Math.sin(this.angle) * pushPower;  
  
                    if (Math.random() < 0.03) {  
                        this.targetAngle = -Math.PI/2 + (Math.random() - 0.5) * 1.0;  
                    }  
                } else {  
                    this.domeRatioX += (1.05 - this.domeRatioX) * 0.03;  
                    this.domeRatioY += (0.91 - this.domeRatioY) * 0.03;  
                }  
  
                const angleDiff = this.targetAngle - this.angle;  
                this.angle += angleDiff * 0.025;  
  
                this.vx *= 0.92;  
                this.vy *= 0.92;  
                this.vy += this.personality === 'active' ? 0.004 : 0.006;  
  
                // 마우스/터치 휘젓기 반응 연산  
                if (isSwaying && mouseX !== -1000) {  
                    const dx = this.x - mouseX;  
                    const dy = this.y - mouseY;  
                    const dist = Math.sqrt(dx * dx + dy * dy);  
                    const influenceRadius = 150;  
  
                    if (dist < influenceRadius && dist > 0) {  
                        const force = (1.0 - (dist / influenceRadius)) * (swayPower + 1.5) * 0.18;  
                        this.vx += (dx / dist) * force;  
                        this.vy += (dy / dist) * force;  
                        this.targetAngle = Math.atan2(this.y - mouseY, this.x - mouseX);  
                    }  
                }  
  
                // [하단 뭉침 방지 강제 기류]  
                const bottomThreshold = h * 0.85;  
                if (this.y > bottomThreshold) {  
                    const depthFactor = (this.y - bottomThreshold) / (h * 0.15);  
                    this.vy -= depthFactor * 0.16; // 위로 밀어내는 완충 부력  
                    this.vx += (Math.random() - 0.5) * 0.05;  
                }  
  
                // [상단 천장 가둠 방지]  
                const topThreshold = h * 0.15;  
                if (this.y < topThreshold) {  
                    const heightFactor = (topThreshold - this.y) / (h * 0.15);  
                    this.vy += heightFactor * 0.1; // 아래로 순환하는 수중 미풍  
                }  
  
                // 개체간 거리 분산 유지  
                jellyfishes.forEach((other, oIdx) => {  
                    if (index === oIdx) return;  
                    const dx = this.x - other.x;  
                    const dy = this.y - other.y;  
                    const distance = Math.sqrt(dx * dx + dy * dy);  
                    const safeDistance = (this.radius + other.radius) * 2.5;  
  
                    if (distance < safeDistance && distance > 0) {  
                        const pushForce = (safeDistance - distance) * 0.0003;  
                        this.vx += (dx / distance) * pushForce;  
                        this.vy += (dy / distance) * pushForce;  
                    }  
                });  
  
                const edgeMarginX = w > 640 ? 80 : 30;  
                const edgeMarginY = h > 640 ? 80 : 30;  
  
                const limitLeft = edgeMarginX + this.radius;  
                const limitRight = w - edgeMarginX - this.radius;  
                const limitTop = edgeMarginY + this.radius;  
                const limitBottom = h - edgeMarginY - this.radius;  
  
                if (this.x < limitLeft) {  
                    this.x = limitLeft;  
                    this.vx *= -0.3;  
                    this.targetAngle = Math.atan2(this.vy, this.vx);  
                } else if (this.x > limitRight) {  
                    this.x = limitRight;  
                    this.vx *= -0.3;  
                    this.targetAngle = Math.atan2(this.vy, this.vx);  
                }  
  
                if (this.y < limitTop) {  
                    this.y = limitTop;  
                    this.vy *= -0.3;  
                    this.targetAngle = Math.atan2(this.vy, this.vx);  
                } else if (this.y > limitBottom) {  
                    this.y = limitBottom;  
                    this.vy *= -0.3;  
                    this.targetAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.5;  
                }  
  
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);  
                const currentLimit = isSwaying ? this.speedLimit * 8 : this.speedLimit;  
                if (speed > currentLimit) {  
                    this.vx = (this.vx / speed) * currentLimit;  
                    this.vy = (this.vy / speed) * currentLimit;  
                }  
  
                this.x += this.vx;  
                this.y += this.vy;  
  
                // 특별 해파리가 전진 수축할 때 보색 발광 포자 잔상 흩뿌림과 신비로운 수중 충격파 링 생성  
                if (this.isSpecial && isContracting) {  
                    const preset = colorPresets[activeColorKey];  
                    const dynamicHue = (preset.hue + this.hueOffset + 360) % 360;  
                    const complementaryHue = (dynamicHue + 180) % 360;  
  
                    if (Math.random() < 0.28) {  
                        screenParticles.push({  
                            x: this.x + (Math.random() - 0.5) * this.radius * 0.8,  
                            y: this.y + this.radius * 0.6,  
                            vx: -this.vx * 0.4 + (Math.random() - 0.5) * 0.15,  
                            vy: -this.vy * 0.4 + 0.15,  
                            radius: 1.2 + Math.random() * 1.8,  
                            hue: complementaryHue,  
                            alpha: 0.6,  
                            decay: 0.012,  
                            type: 'ascension'  
                        });  
                    }  
  
                    // 웅장한 신비로움을 위한 펄스형 수중 충격파 링 생성 (Shockwave Ring)  
                    if (Math.random() < 0.04) {  
                        screenParticles.push({  
                            x: this.x,  
                            y: this.y,  
                            vx: 0,  
                            vy: 0,  
                            radius: this.radius * 0.8,  
                            hue: complementaryHue,  
                            alpha: 0.5,  
                            decay: 0.015,  
                            type: 'shockwave'  
                        });  
                    }  
                }  
  
                // 촉수 세그먼트 물리 연산  
                this.tentacles.forEach((tentacle, tIdx) => {  
                    const offsetIndex = tIdx - (this.tentacles.length - 1) / 2;  
                    const attachmentAngle = this.angle + Math.PI;   
                    const spacing = this.radius * 0.22 * this.domeRatioX;  
                      
                    let targetX = this.x + Math.cos(attachmentAngle) * (this.radius * 0.25) + Math.cos(attachmentAngle + Math.PI/2) * (offsetIndex * spacing);  
                    let targetY = this.y + Math.sin(attachmentAngle) * (this.radius * 0.25) + Math.sin(attachmentAngle + Math.PI/2) * (offsetIndex * spacing);  
  
                    tentacle.segments.forEach((segment, sIdx) => {  
                        if (sIdx === 0) {  
                            segment.x += (targetX - segment.x) * 0.25;  
                            segment.y += (targetY - segment.y) * 0.25;  
                        } else {  
                            const prev = tentacle.segments[sIdx - 1];  
                            const dx = segment.x - prev.x;  
                            const dy = segment.y - prev.y;  
                            const dist = Math.sqrt(dx * dx + dy * dy);  
                              
                            const optimalDist = this.isSpecial ? 3.0 : 2.4;  
  
                            if (dist > optimalDist) {  
                                const ratio = (dist - optimalDist) / dist;  
                                segment.x -= dx * ratio * 0.85;  
                                segment.y -= dy * ratio * 0.85;  
                            }  
  
                            segment.x -= this.vx * (sIdx * 0.04);  
                            segment.y -= this.vy * (sIdx * 0.04);  
                            segment.y += 0.06;  
  
                            segment.x += Math.sin(this.pulseTimer * 1.5 + sIdx * 0.1) * 0.02;  
                        }  
                    });  
                });  
  
                // 구강완 연산  
                this.oralArms.forEach((arm, aIdx) => {  
                    const offsetIndex = aIdx - (this.oralArms.length - 1) / 2;  
                    const attachmentAngle = this.angle + Math.PI;  
                    const spacing = this.radius * 0.18 * this.domeRatioX;  
  
                    let targetX = this.x + Math.cos(attachmentAngle) * (this.radius * 0.1) + Math.cos(attachmentAngle + Math.PI/2) * (offsetIndex * spacing);  
                    let targetY = this.y + Math.sin(attachmentAngle) * (this.radius * 0.1) + Math.sin(attachmentAngle + Math.PI/2) * (offsetIndex * spacing);  
  
                    arm.forEach((segment, sIdx) => {  
                        if (sIdx === 0) {  
                            segment.x += (targetX - segment.x) * 0.2;  
                            segment.y += (targetY - segment.y) * 0.2;  
                        } else {  
                            const prev = arm[sIdx - 1];  
                            const dx = segment.x - prev.x;  
                            const dy = segment.y - prev.y;  
                            const dist = Math.sqrt(dx * dx + dy * dy);  
                            const optimalDist = this.isSpecial ? 2.5 : 1.8;  
  
                            if (dist > optimalDist) {  
                                const ratio = (dist - optimalDist) / dist;  
                                segment.x -= dx * ratio * 0.75;  
                                segment.y -= dy * ratio * 0.75;  
                            }  
  
                            segment.x -= this.vx * (sIdx * 0.06);  
                            segment.y -= this.vy * (sIdx * 0.06);  
                            segment.y += 0.07;  
  
                            segment.x += Math.sin(this.pulseTimer * 1.0 + sIdx * 0.12) * 0.03;  
                        }  
                    });  
                });  
            }  
  
            draw() {  
                ctx.save();  // [Outer Save]  
  
                const preset = colorPresets[activeColorKey];  
                let dynamicHue = (preset.hue + this.hueOffset + 360) % 360;  
                const complementaryHue = (dynamicHue + 180) % 360;  
  
                // 핵심 크기 가변변수(organRad) 선언을 분기 밖 상단에 완벽히 배치하여 소멸 오류 원천 진압!  
                const organRad = this.radius * (this.isSpecial ? 0.32 : 0.28) * this.domeRatioX;  
  
                // 핵심 핵(Gonads)의 투명도 조절로 흐릿하고 영롱한 몽롱성 부여  
                let coreColor = `hsla(${dynamicHue - 5}, 100%, 88%, ${this.alpha * 0.22})`;

                        }

                        ctx.stroke();  
                    });  
  
                    // 3. 해파리 머리 좌표 변환 및 각도 회전  
                    ctx.translate(this.x, this.y);  
                    ctx.rotate(this.angle + Math.PI / 2);  
  
                    ctx.shadowBlur = this.personality === 'active' ? 12 : 18;

                ctx.save();  
                ctx.translate(this.x, this.y);  
                ctx.rotate(this.angle + Math.PI / 2);

                    ctx.stroke();  
                }  
                ctx.restore();

            }

        // 유기적 광선식 반딧불이 클래스  
        class DetailedFirefly {  
            constructor(isSpecial = false) {

                const h = window.innerHeight;  
                  
                const spawnMarginX = w > 640 ? 100 : 50;  
                const spawnMarginY = h > 640 ? 100 : 50;  
  
                this.x = spawnMarginX + Math.random() * (w - spawnMarginX * 2);  
                this.y = spawnMarginY + Math.random() * (h - spawnMarginY * 2);  
                  
                this.vx = (Math.random() - 0.5) * 0.25;  
                this.vy = (Math.random() - 0.5) * 0.25;  
                  
                this.isSpecial = isSpecial; // 특별 반딧불이 여부  
                this.personality = Math.random() < 0.55 ? 'calm' : 'wandering';  
                  
                this.radius = this.isSpecial

                    : 0.8 + Math.random() * 0.9;  
                  
                this.angle = Math.random() * Math.PI * 2;  
                this.targetAngle = this.angle;  
                this.targetChangeTimer = 0;

                this.maxGlowMultiplier = this.isSpecial ? 16.0 + Math.random() * 8.0 : 10.0 + Math.random() * 8.0;   
                this.maxAlpha = this.isSpecial ? 0.75 + Math.random() * 0.1 : 0.6 + Math.random() * 0.25;  
                  
                // 오로라 반딧불이는 무지개 프리즘 아우라 지속 전환

            update(index) {  
                const w = window.innerWidth;  
                const h = window.innerHeight;  
                  
                this.blinkTimer += this.blinkSpeed;  
  
                if (this.isSpecial) {  
                    // 무지개 프리즘 색상 회전

                    if (this.targetChangeTimer <= 0) {

                        const range = Math.random() < 0.5 ? [ -Math.PI/4, Math.PI/4 ] : [ Math.PI - Math.PI/4, Math.PI + Math.PI/4 ];

                const topThreshold = h * 0.15;

                    this.vy -= 0.04;

                const edgeMarginY = h > 640 ? 60 : 30;

                const limitRight = w - edgeMarginX;  
                const limitTop = edgeMarginY;  
                const limitBottom = h - edgeMarginY;  
  
                if (this.x < limitLeft) { this.x = limitLeft; this.targetAngle = (Math.random() - 0.5) * Math.PI * 0.5; this.angle = this.targetAngle; }  
                if (this.x > limitRight) { this.x = limitRight; this.targetAngle = Math.PI + (Math.random() - 0.5) * Math.PI * 0.5; this.angle = this.targetAngle; }  
                if (this.y < limitTop) { this.y = limitTop; this.targetAngle = Math.PI / 4 + Math.random() * (Math.PI / 2); this.angle = this.targetAngle; }  
                if (this.y > limitBottom) { this.y = limitBottom; this.targetAngle = -Math.PI / 4 - Math.random() * (Math.PI / 2); this.angle = this.targetAngle; }  
  
                if (this.alpha < this.maxAlpha) {  
                    this.alpha += this.fadeRate;  
                }

            draw() {

                    ctx.fillStyle = grad;  
                    ctx.fill();  
  
                    // 특별 오로라 반딧불이도 일반 반딧불이처럼 우아한 실물 몸체를 그리도록 롤백  
                    ctx.globalCompositeOperation = 'source-over';  
                    ctx.translate(this.x, this.y);  
                    ctx.rotate(flyAngle);  
  
                    // 앞가슴 (Thorax)  
                    ctx.beginPath();  
                    ctx.arc(this.radius * 0.4, 0, this.radius * 0.35, 0, Math.PI * 2);  
                    ctx.fillStyle = this.isSpecial ? 'rgba(255, 120, 0, 0.8)' : 'rgba(130, 25, 15, 0.7)';   
                    ctx.fill();  
  
                    // 등 날개갑 (Elytra)  
                    ctx.beginPath();  
                    ctx.ellipse(-this.radius * 0.25, 0, this.radius * 0.85, this.radius * 0.42, 0, 0, Math.PI * 2);  
                    ctx.fillStyle = this.isSpecial ? 'rgba(40, 20, 50, 0.9)' : 'rgba(20, 20, 18, 0.85)';   
                    ctx.fill();  
  
                    ctx.restore();  
                }  
            }  
        }  
  
        function spawnJellyfish() {  
            jellyfishes.push(new RealisticJellyfish(false));  
            checkAndEforceJellyfish();  
        }  
  
        function spawnFirefly() {  
            fireflies.push(new DetailedFirefly(false));  
            checkAndEforceFirefly();  
        }  
  
        // 해파리 30마리 검사 및 에인션트 진화  
        function checkAndEforceJellyfish() {  
            const normalJellyfish = jellyfishes.filter(j => !j.isSpecial);  
            if (normalJellyfish.length >= 30) {  
                const w = window.innerWidth;  
                const h = window.innerHeight;  
                  
                normalJellyfish.forEach(j => {  
                    triggerAscensionVisual(j.x, j.y, colorPresets[activeColorKey].hue);  
                });  
  
                jellyfishes = jellyfishes.filter(j => j.isSpecial);  
  
                const specialOne = new RealisticJellyfish(true);  
                specialOne.x = w / 2;  
                specialOne.y = h / 2;  
                jellyfishes.push(specialOne);  
  
                triggerAscensionVisual(w / 2, h / 2, 20); // 오렌지/코랄 빛 대폭발  
  
                showToast('Ancient Coral Unlocked', '30마리의 해파리가 공명하여 위성 광자와 보색 코어를 품은 고대 해파리가 탄생했습니다!', '👑');  
            }  
        }  
  
        // 반딧불이 30마리 검사 및 오로라 진화  
        function checkAndEforceFirefly() {  
            const normalFireflies = fireflies.filter(f => !f.isSpecial);  
            if (normalFireflies.length >= 30) {  
                const w = window.innerWidth;  
                const h = window.innerHeight;  
  
                normalFireflies.forEach(f => {  
                    triggerAscensionVisual(f.x, f.y, f.baseHue);  
                });  
  
                fireflies = fireflies.filter(f => f.isSpecial);  
  
                const specialOne = new DetailedFirefly(true);  
                specialOne.x = w / 2;  
                specialOne.y = h / 2;  
                fireflies.push(specialOne);  
  
                triggerAscensionVisual(w / 2, h / 2, 200); // 몽환적인 프리즘 보라/시안 폭발  
  
                showToast('Aurora Prism Unlocked', '30마리의 반딧불이가 하나로 어우러져 오로라 반딧불이가 탄생했습니다!', '🌈');  
            }  
        }  
  
        // 잔잔한 부유 기포 깔아두기  
        for(let i=0; i<18; i++) {  
            backgroundBubbles.push(new Bubble());  
        }  
  
        function animate() {  
            const w = window.innerWidth;  
            const h = window.innerHeight;  
  
            if (currentEnvironment === 'jellyfish') {  
                ctx.fillStyle = 'rgba(1, 1, 3, 0.12)';   
            } else {  
                ctx.fillStyle = 'rgba(2, 3, 2, 0.15)';   
            }  
            ctx.fillRect(0, 0, w, h);  
  
            backgroundBubbles.forEach(b => {  
                b.update();  
                b.draw();  
            });  
  
            if (currentEnvironment === 'jellyfish') {  
                jellyfishes.forEach((j, idx) => {  
                    j.update(idx);  
                    j.draw();  
                });  
            } else {  
                fireflies.forEach((f, idx) => {  
                    f.update(idx);  
                    f.draw();  
                });  
            }  
  
            // 합성 승천 파티클 및 해파리 충격파 링 렌더링 루프  
            ctx.save();  
            for (let i = screenParticles.length - 1; i >= 0; i--) {  
                const p = screenParticles[i];  
                
                if (p.type === 'shockwave') {  
                    // 고대종 해파리의 충격파 그리기 (매우 굵고 부드러운 안개 링 효과)  
                    p.radius += 2.0;  
                    p.alpha -= p.decay;  
  
                    if (p.alpha <= 0) {  
                        screenParticles.splice(i, 1);  
                        continue;  
                    }  
  
                    ctx.save();  
                    ctx.globalCompositeOperation = 'screen';  
                    ctx.beginPath();  
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);  
                    // 얇은 선이 아닌 흐릿한 발광체 고리로 그리기 위해 그림자 효과와 투명도 조절  
                    ctx.strokeStyle = `hsla(${p.hue}, 100%, 75%, ${p.alpha * 0.10})`;  
                    ctx.lineWidth = 4.0;  
                    ctx.shadowBlur = 12;  
                    ctx.shadowColor = `hsla(${p.hue}, 100%, 65%, ${p.alpha * 0.20})`;  
                    ctx.stroke();  
                    ctx.restore();  
                } else if (p.type === 'softTrail') {  
                    // 특별 반딧불이 전용 뭉글뭉글한 빛 안개 궤적 잔상  
                    p.x += p.vx;  
                    p.y += p.vy;  
                    p.alpha -= p.decay;  
  
                    if (p.alpha <= 0) {  
                        screenParticles.splice(i, 1);  
                        continue;  
                    }  
  
                    ctx.save();  
                    ctx.globalCompositeOperation = 'screen';  
                    // 원형이 아닌, 외각이 극도로 뭉개진 안개 광채로만 렌더링  
                    const trailGlow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 6);  
                    trailGlow.addColorStop(0, `hsla(${p.hue}, 100%, 80%, ${p.alpha * 0.35})`);  
                    trailGlow.addColorStop(0.5, `hsla(${(p.hue + 30) % 360}, 100%, 60%, ${p.alpha * 0.12})`);  
                    trailGlow.addColorStop(1, 'rgba(0,0,0,0)');  
  
                    ctx.beginPath();  
                    ctx.arc(p.x, p.y, p.radius * 6, 0, Math.PI * 2);  
                    ctx.fillStyle = trailGlow;  
                    ctx.fill();  
                    ctx.restore();  
                } else {  
                    // 승천 파티클  
                    p.x += p.vx;  
                    p.y += p.vy;  
                    p.vy += 0.015;   
                    p.alpha -= p.decay;  
  
                    if (p.alpha <= 0) {  
                        screenParticles.splice(i, 1);  
                        continue;  
                    }  
  
                    ctx.save();  
                    ctx.globalCompositeOperation = 'screen';  
                    ctx.beginPath();  
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);  
                    ctx.fillStyle = `hsla(${p.hue}, 100%, 75%, ${p.alpha})`;  
                    ctx.shadowBlur = 8;  
                    ctx.shadowColor = `hsla(${p.hue}, 100%, 65%, ${p.alpha * 0.5})`;  
                    ctx.fill();  
                    ctx.restore();  
                }  
            }  
            ctx.restore();  
  
            // 휘젓기 감쇠 효과  
            if (isSwaying) {  
                swayPower *= 0.95;  
                if (swayPower < 0.1) {  
                    isSwaying = false;  
                }  
            }  
  
            requestAnimationFrame(animate);  
        }  
  
        window.onload = function() {  
            animate();  
            renderDisplay();  
            updateStyleWithPreset();  
        }  
    </script>  
</body>  
</html>
